[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "muse-code-openrouter"
version = "0.2.0"
description = "Use OpenRouter API keys and models directly inside Meta Muse Code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xhluca" }]
keywords = ["muse-code", "muse-spark", "openrouter", "coding-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.urls]
Homepage = "https://xhluca.github.io/muse-code-openrouter/"
Repository = "https://github.com/xhluca/muse-code-openrouter"
Issues = "https://github.com/xhluca/muse-code-openrouter/issues"
Installer = "https://xhluca.github.io/muse-code-openrouter/install.sh"

[project.scripts]
muse-openrouter = "muse_code_openrouter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/muse_code_openrouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
